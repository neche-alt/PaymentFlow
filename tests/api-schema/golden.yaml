openapi: 3.0.0
info:
  title: StellarEduPay API
  version: 1.0.0
  description: Decentralized school fee payment system built on Stellar blockchain

servers:
  - url: http://localhost:5000/api
    description: API Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin authentication

  schemas:
    Payment:
      type: object
      properties:
        _id:
          type: string
        schoolId:
          type: string
        studentId:
          type: string
        txHash:
          type: string
        amount:
          type: number
        feeAmount:
          type: number
        status:
          type: string
          enum:
            - PENDING
            - SUBMITTED
            - SUCCESS
            - FAILED
            - DISPUTED
            - INVALID
        confirmedAt:
          type: string
          format: date-time
        feeValidationStatus:
          type: string
          enum:
            - valid
            - underpaid
            - overpaid
            - partial
            - unknown

    Student:
      type: object
      properties:
        _id:
          type: string
        schoolId:
          type: string
        studentId:
          type: string
        name:
          type: string
        class:
          type: string
        feeAmount:
          type: number
        contactEmail:
          type: string
          format: email

    School:
      type: object
      properties:
        _id:
          type: string
        schoolId:
          type: string
        name:
          type: string
        slug:
          type: string
        stellarAddress:
          type: string
        network:
          type: string
          enum:
            - testnet
            - mainnet
        isActive:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string

security:
  - BearerAuth: []

# Golden endpoint inventory — breaking changes (removed endpoints, removed
# required fields, changed types) must fail CI.  Non-breaking additions
# (new optional fields, new endpoints) are allowed.
x-golden-endpoints:
  - path: /api/payments/verify
    method: post
    summary: Verify a payment transaction
    requiredRequestFields:
      - txHash
    responseStatus: 200
    requiredResponseFields:
      - verified

  - path: /api/payments/intent
    method: post
    summary: Create a payment intent
    requiredRequestFields: []
    responseStatus: 201

  - path: /api/payments/instructions/{studentId}
    method: get
    summary: Get payment instructions for a student
    responseStatus: 200
    requiredResponseFields:
      - walletAddress
      - memo

  - path: /api/payments
    method: get
    summary: List all payments
    responseStatus: 200

  - path: /api/students
    method: get
    summary: List all students
    responseStatus: 200

  - path: /api/students/{studentId}
    method: get
    summary: Get a single student
    responseStatus: 200

  - path: /api/schools
    method: get
    summary: List all schools
    responseStatus: 200

  - path: /api/health
    method: get
    summary: Health check
    responseStatus: 200
    requiredResponseFields:
      - status

  - path: /api/health/live
    method: get
    summary: Liveness probe
    responseStatus: 200

  - path: /api/health/ready
    method: get
    summary: Readiness probe
    responseStatus: 200

  - path: /api/docs.json
    method: get
    summary: OpenAPI specification
    responseStatus: 200
    requiredResponseFields:
      - openapi
      - info
      - paths

x-schema-version: "1.0.0"
